name: Empty Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  empty:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete all tracked files
        run: |
          git rm -r --ignore-unmatch .
          git rm -r --cached --ignore-unmatch .
          git commit -m "Start over with an empty repository"

      - name: Push changes
        run: git push
