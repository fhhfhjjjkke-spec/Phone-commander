<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone Commander</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

    :root {
      --bg: #0d0f11;
      --bg-2: #171b1d;
      --panel: #1a1d20;
      --panel-2: #23282c;
      --message-ghost: #1e2428;
      --message-user: #2d4a52;
      --message-user-2: #3b6468;
      --text: #edf1e8;
      --muted: #b7b9b2;
      --line: rgba(255,255,255,0.08);
      --accent: #d7c08d;
      --accent-2: #9fae88;
      --shadow: rgba(0,0,0,0.32);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(circle at top, rgba(215,192,141,0.08), transparent 40%),
        linear-gradient(180deg, #0a0d0f 0%, #121718 100%);
      color: var(--text);
      font-family: "IBM Plex Mono", "Courier New", monospace;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .phone {
      width: min(100%, 430px);
      height: min(92vh, 860px);
      background: rgba(16, 18, 20, 0.96);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: 0 28px 80px var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-top: 2px solid rgba(255,255,255,0.04);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 18px 14px;
      background: rgba(20, 23, 26, 0.96);
      border-bottom: 1px solid var(--line);
    }

    .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      color: #101414;
      font-size: 15px;
      font-weight: 700;
      font-family: "Special Elite", "Courier New", monospace;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18);
    }

    .title-wrap {
      line-height: 1.1;
    }

    .title {
      font-family: "Special Elite", "Courier New", monospace;
      font-size: 1.08rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }

    .subtitle {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid rgba(215,192,141,0.22);
      background: rgba(215,192,141,0.05);
      border-radius: 999px;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d7c08d;
      box-shadow: 0 0 10px rgba(215,192,141,0.8);
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 12px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.01), transparent),
        #111517;
    }

    .message-row {
      display: flex;
      margin-bottom: 12px;
    }

    .message-row.self {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 82%;
      padding: 11px 14px 10px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.96rem;
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid rgba(255,255,255,0.04);
    }

    .message-row.bot .bubble {
      background: var(--message-ghost);
      color: var(--text);
      border-top-left-radius: 6px;
    }

    .message-row.self .bubble {
      background: linear-gradient(135deg, var(--message-user), var(--message-user-2));
      color: var(--text);
      border-top-right-radius: 6px;
    }

    .meta {
      display: block;
      margin-top: 8px;
      font-size: 0.64rem;
      opacity: 0.72;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .composer {
      padding: 12px 14px 16px;
      border-top: 1px solid var(--line);
      background: rgba(19, 22, 24, 0.96);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 8px 8px 14px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.02);
      border-radius: 16px;
    }

    input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      color: var(--text);
      font-size: 0.98rem;
      padding: 11px 0;
      font-family: "IBM Plex Mono", "Courier New", monospace;
    }

    input::placeholder {
      color: var(--muted);
      opacity: 0.9;
    }

    .send-btn {
      border: none;
      background: linear-gradient(135deg, var(--accent), #b7b58c);
      color: #101414;
      padding: 11px 16px;
      border-radius: 12px;
      font-family: "Special Elite", "Courier New", monospace;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(215,192,141,0.18);
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 12px;
    }

    .chip {
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.07);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.18s ease;
      font-family: "IBM Plex Mono", "Courier New", monospace;
    }

    .chip:hover {
      background: rgba(255,255,255,0.05);
      transform: translateY(-1px);
    }

    @media (max-width: 420px) {
      body {
        padding: 10px;
      }

      .phone {
        height: 96vh;
        border-radius: 18px;
      }

      .title {
        font-size: 0.96rem;
      }

      .bubble {
        max-width: 88%;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <div class="left">
        <div class="avatar">P</div>
        <div class="title-wrap">
          <div class="title">Phone Commander</div>
          <div class="subtitle">Ai dispatch</div>
        </div>
      </div>

      <div class="status"><span class="dot"></span> Online</div>
    </div>

    <div class="chat" id="chat">
      <div class="message-row bot">
        <div class="bubble">
          Awaiting command...
          <span class="meta">Ready</span>
        </div>
      </div>

      <div class="message-row self">
        <div class="bubble">
          Open WhatsApp and send: “I’m on my way.”
          <span class="meta">Sent</span>
        </div>
      </div>

      <div class="message-row bot">
        <div class="bubble">
          Affimative. I will locate the target thread, compose the message, and transmit.
          <span class="meta">Live</span>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="input-row">
        <input id="cmd" type="text" placeholder="Command input..." />
        <button class="send-btn" id="sendBtn">Send</button>
      </div>

      <div class="quick-actions">
        <button class="chip" type="button" data-cmd="Open camera">Open camera</button>
        <button class="chip" type="button" data-cmd="Swipe up">Swipe up</button>
        <button class="chip" type="button" data-cmd="Open settings">Open settings</button>
        <button class="chip" type="button" data-cmd="Tap center">Tap center</button>
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const cmdInput = document.getElementById('cmd');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(text, from = 'bot') {
      const row = document.createElement('div');
      row.className = 'message-row ' + (from === 'self' ? 'self' : 'bot');

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = text + '<span class="meta">Now</span>';

      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendCommand() {
      const value = cmdInput.value.trim();
      if (!value) return;

      addMessage(value, 'self');

      setTimeout(() => {
        addMessage('Executing command sequence…', 'bot');
      }, 180);

      cmdInput.value = '';
    }

    sendBtn.addEventListener('click', sendCommand);

    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendCommand();
    });

    document.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        cmdInput.value = chip.dataset.cmd;
        sendCommand();
      });
    });
  </script>
</body>
</html>
